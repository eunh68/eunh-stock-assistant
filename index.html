<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관심종목 시세</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --sub: #6b7280;
    --border: #e5e7eb;
    --up: #d60000;
    --down: #0051c7;
    --flat: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card-bg: #1b1e25;
      --text: #f0f0f0;
      --sub: #9aa0aa;
      --border: #2b2f38;
      --up: #ff5c5c;
      --down: #5c9cff;
      --flat: #9aa0aa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 20px;
    text-align: center;
    margin: 8px 0 4px;
  }
  .updated {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .list {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .name {
    font-size: 16px;
    font-weight: 600;
  }
  .code {
    font-size: 12px;
    color: var(--sub);
    margin-top: 2px;
  }
  .right {
    text-align: right;
  }
  .price {
    font-size: 17px;
    font-weight: 700;
  }
  .change {
    font-size: 13px;
    margin-top: 2px;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }
  .hint {
    max-width: 480px;
    margin: 28px auto 0;
    font-size: 12px;
    color: var(--sub);
    line-height: 1.6;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .hint code {
    background: rgba(127,127,127,0.15);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<h1>내 관심종목</h1>
<div class="updated" id="updated"></div>
<div class="list" id="list"></div>

<div class="hint">
  가격을 수정하려면 이 파일(index.html)을 열어서 아래쪽 <code>&lt;script&gt;</code> 안에 있는
  <code>stocks</code> 배열 값을 원하는 종목명/현재가/전일종가로 바꾸고 저장한 뒤
  새로고침하세요. 등락률은 자동으로 계산됩니다.
</div>

<script>
  // ▼▼▼ 여기 값만 수정하세요 (종목명, 현재가, 전일종가) ▼▼▼
  const stocks = [
    { name: "삼성전자",   code: "005930", price: 78500,  prevClose: 77800 },
    { name: "SK하이닉스", code: "000660", price: 215000, prevClose: 219500 },
    { name: "카카오",     code: "035720", price: 41200,  prevClose: 41200 },
    { name: "NAVER",      code: "035420", price: 198500, prevClose: 194000 },
  ];
  // ▲▲▲ 여기까지 ▲▲▲

  const fmtNumber = (n) => n.toLocaleString("ko-KR");

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    stocks.forEach((s) => {
      const diff = s.price - s.prevClose;
      const pct = s.prevClose ? (diff / s.prevClose) * 100 : 0;
      const dir = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const sign = diff > 0 ? "+" : "";
      const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="name">${s.name}</div>
          <div class="code">${s.code}</div>
        </div>
        <div class="right">
          <div class="price">${fmtNumber(s.price)}원</div>
          <div class="change ${dir}">
            ${arrow} ${fmtNumber(Math.abs(diff))} (${sign}${pct.toFixed(2)}%)
          </div>
        </div>
      `;
      list.appendChild(card);
    });

    document.getElementById("updated").textContent =
      "마지막 갱신: " + new Date().toLocaleString("ko-KR");
  }

  render();
</script>

</body>
</html>
