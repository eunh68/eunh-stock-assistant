<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관심종목 시세</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f2ee;
    --card-bg: #fffdf9;
    --text: #211f1a;
    --sub: #7a7669;
    --border: #e2ddd0;
    --accent: #4a5d4e;
    --up: #b6412e;
    --down: #2f5f9e;
    --flat: #7a7669;
    --shadow: 0 1px 2px rgba(33,31,26,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card-bg: #1f2123;
      --text: #ece9e2;
      --sub: #93907f;
      --border: #313330;
      --accent: #8fae94;
      --up: #e2705d;
      --down: #7ea6de;
      --flat: #93907f;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181a;
    --card-bg: #1f2123;
    --text: #ece9e2;
    --sub: #93907f;
    --border: #313330;
    --accent: #8fae94;
    --up: #e2705d;
    --down: #7ea6de;
    --flat: #93907f;
    --shadow: none;
  }
  :root[data-theme="light"] {
    --bg: #f3f2ee;
    --card-bg: #fffdf9;
    --text: #211f1a;
    --sub: #7a7669;
    --border: #e2ddd0;
    --accent: #4a5d4e;
    --up: #b6412e;
    --down: #2f5f9e;
    --flat: #7a7669;
    --shadow: 0 1px 2px rgba(33,31,26,0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Pretendard", "Malgun Gothic", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 16px 60px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .updated {
    text-align: center;
    color: var(--sub);
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 28px;
  }
  .list {
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .code {
    font-size: 12px;
    color: var(--sub);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .right {
    text-align: right;
  }
  .price {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .change {
    font-size: 13px;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--flat); }
  .hint {
    max-width: 460px;
    margin: 32px auto 0;
    font-size: 12.5px;
    color: var(--sub);
    line-height: 1.7;
    background: var(--card-bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .hint code {
    background: rgba(127,127,127,0.15);
    padding: 1px 5px;
    border-radius: 4px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<h1>내 관심종목</h1>
<div class="updated" id="updated"></div>
<div class="list" id="list"></div>

<div class="hint">
  가격을 수정하려면 이 파일(index.html)을 열어서 아래쪽 <code>&lt;script&gt;</code> 안에 있는
  <code>stocks</code> 배열 값을 원하는 종목명/현재가/전일종가로 바꾸고 저장한 뒤
  새로고침하세요. 등락률은 자동으로 계산됩니다.
</div>

<script>
  // ▼▼▼ 여기 값만 수정하세요 (종목명, 현재가, 전일종가) ▼▼▼
  const stocks = [
    { name: "삼성전자",   code: "005930", price: 78500,  prevClose: 77800 },
    { name: "SK하이닉스", code: "000660", price: 215000, prevClose: 219500 },
    { name: "카카오",     code: "035720", price: 41200,  prevClose: 41200 },
    { name: "NAVER",      code: "035420", price: 198500, prevClose: 194000 },
  ];
  // ▲▲▲ 여기까지 ▲▲▲

  const fmtNumber = (n) => n.toLocaleString("ko-KR");

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";

    stocks.forEach((s) => {
      const diff = s.price - s.prevClose;
      const pct = s.prevClose ? (diff / s.prevClose) * 100 : 0;
      const dir = diff > 0 ? "up" : diff < 0 ? "down" : "flat";
      const sign = diff > 0 ? "+" : "";
      const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "-";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="name">${s.name}</div>
          <div class="code">${s.code}</div>
        </div>
        <div class="right">
          <div class="price">${fmtNumber(s.price)}원</div>
          <div class="change ${dir}">
            ${arrow} ${fmtNumber(Math.abs(diff))} (${sign}${pct.toFixed(2)}%)
          </div>
        </div>
      `;
      list.appendChild(card);
    });

    document.getElementById("updated").textContent =
      "마지막 갱신: " + new Date().toLocaleString("ko-KR");
  }

  render();
</script>

</body>
</html>
